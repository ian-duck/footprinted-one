<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Footprinted.eu</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link rel="stylesheet" href="./footprinted-design-system.css" />
    <link rel="stylesheet" href="./map-page.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="app-header">
        <div class="app-header__inner">
          <button class="nav-pill" type="button">Footprinted.eu</button>
          <nav class="nav-group" aria-label="Main navigation">
            <button class="nav-pill" type="button">Quests</button>
            <button class="nav-pill" type="button">Profile</button>
          </nav>
        </div>
      </header>

      <main class="quest-layout">
        <aside class="quest-sidebar">
          <section class="panel-card" aria-label="Quest progress">
            <div class="quest-card-header">
              <h2>Slovensko 1978</h2>
            </div>

            <div
              id="quest-progress-ring"
              class="progress-ring"
              style="--progress: 0;"
              aria-label="0 percent complete"
              role="button"
              tabindex="0"
              aria-pressed="false"
            >
              <div id="quest-progress-value" class="progress-ring__value">0%</div>
            </div>

            <select id="region-select" class="dropdown" aria-label="Region select">
              <option value="All">All</option>
            </select>
            <select id="district-select" class="dropdown" aria-label="District select">
              <option value="All">All</option>
            </select>
          </section>

          <section class="panel-card" aria-label="Recently footprinted places">
            <div class="list-block">
              <h3 class="list-title">Recently footprinted</h3>
              <div class="footprint-list footprint-list--recent">
                <div class="footprint-row">
                  <span class="badge-stamp" aria-hidden="true">✓</span>
                  <span class="footprint-row__label">Piazza del Duomo</span>
                </div>
                <div class="footprint-row">
                  <span class="badge-stamp" aria-hidden="true">✓</span>
                  <span class="footprint-row__label">Ponte Vecchio</span>
                </div>
              </div>
            </div>
          </section>

          <section class="panel-card" aria-label="Pending locations">
            <div class="list-block">
              <h3 class="list-title">Not footprinted yet</h3>
              <div class="footprint-list footprint-list--pending">
                <div class="footprint-row footprint-row--pending">
                  <span class="badge-pending" aria-hidden="true"></span>
                  <span class="footprint-row__label">Giardino di Boboli</span>
                </div>
                <div class="footprint-row footprint-row--pending">
                  <span class="badge-pending" aria-hidden="true"></span>
                  <span class="footprint-row__label">Mercato Centrale</span>
                </div>
              </div>
            </div>
          </section>
        </aside>

        <section class="map-panel" aria-label="Map preview">
          <div id="map" aria-label="Map with footprint markers"></div>
        </section>
      </main>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="./map.js"></script>
  </body>
</html>
